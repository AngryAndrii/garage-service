services:
  db:
    image: postgres:17
    container_name: garage_service-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - db-data-19:/var/lib/postgresql/data
    restart: unless-stopped

  odoo:
    image: odoo:19
    container_name: garage_service-server
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8074:8069"
      - "8073:8072"
    volumes:
      - ./addons:/mnt/extra-addons
      - ./config:/etc/odoo
      - odoo-data-19:/var/lib/odoo
    command: ["odoo", "-c", "/etc/odoo/odoo.conf", "--dev=xml,qweb"]
    restart: unless-stopped

volumes:
  db-data-19:
  odoo-data-19: